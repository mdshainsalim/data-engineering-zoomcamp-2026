services:
  postgres:
    image: postgres:16
    container_name: zoomcamp-postgres
    environment:
      POSTGRES_USER: zoomcamp
      POSTGRES_PASSWORD: zoomcamp
      POSTGRES_DB: zoomcamp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: